<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tsurotations</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="boardWrap" class="gameSurface" hidden>
  <svg id="board"></svg>
  <div id="bonusControls" hidden>
    <button id="bonusRotateBtnLeft" class="secondary" title="Rotate counter-clockwise" aria-label="Rotate counter-clockwise">↺</button>
    <button id="bonusRotateBtnRight" class="secondary" title="Rotate clockwise" aria-label="Rotate clockwise">↻</button>
    <button id="bonusSkipBtn" class="secondary" title="Skip all rotations" aria-label="Skip all rotations">×</button>
    <button id="bonusConfirmBtn" title="Confirm" aria-label="Confirm">✓</button>
  </div>
</div>

<div id="gameMenu">
  <div class="rowContainer">
    <h1>Tsurotations</h1>
    <div class="dropdown">
      <button id="settingsBtn" class="dropdown-btn" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu">
          <i data-lucide="settings"></i>
          <span class="sr-only">Open settings menu</span>
      </button>
      <div id="settingsMenu" class="dropdown-menu" role="menu" aria-labelledby="settingsBtn" hidden>
        <h2><label for="playerNameInput">Player Name</label></h2>
        <input type="text" id="playerNameInput" name="playerNameInput" maxlength="20" spellcheck="false" placeholder="Choose a name">
      </div>
    </div>
  </div>

  <div class="card" id="setupCard">
    <h2>Setup</h2>
    <div class="row">
      <div><label>Board size</label><input id="boardSize" type="number" min="4" max="12" value="6"></div>
      <div><label>Players</label><input id="numPlayers" type="number" min="2" max="8" value="2"></div>
    </div>
    <div class="checkbox-wrapper" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
      <input class="substituted" type="checkbox" id="vWrap">
      <label for="vWrap"> Torus wrap</label>
      <input class="substituted" type="checkbox" id="vRotatePass" checked>
      <label for="vRotatePass"> Rotations</label>
      <input class="substituted" type="checkbox" id="vReplacements">
      <label for="vReplacements"> Replacements</label>
      <input class="substituted" type="checkbox" id="vOnePerCell" checked>
      <label for="vOnePerCell"> One player per cell (start)</label>
      <input class="substituted" type="checkbox" id="vNoNeighbors">
      <label for="vNoNeighbors"> No neighbors (start)</label>
    </div>
    <button id="newGameBtn" style="margin-top: 10px; width: 100%;">New Game</button>

    <br><br>

    <h2 id="multiplayerMenuLabel">Multiplayer</h2>
    <div class="row">
      <button id="hostBtn">Host game</button>
      <input id="joinId" placeholder="Host code" aria-label="Host code">
      <button id="joinBtn" class="secondary">Join</button>
      <button id="disconnectBtn" class="secondary" hidden>Disconnect</button>
    </div>
    <div id="networkStatus" class="networkStatus">Local game</div>
    <div id="hostCodePanel" class="hostCodePanel hidden" aria-live="polite">
      <div id="hostCodeLabel" class="hostCodeLabel"></div>
      <div class="hostCodeRow">
        <div id="hostCode" class="hostCode"></div>
        <button id="copyBtn" class="copyBtn hidden" onclick="copyGameId()" aria-label="Copy host code" title="Copy host code"><i data-lucide="copy"></i></button>
      </div>
    </div>
    <div id="toast" class="toast">Copied!</div>
  </div>

  <div class="card gameSurface" hidden>
    <h2>Players</h2>
    <div id="players"></div>
  </div>

  <div class="card gameSurface" style="display: none;" hidden>
    <h2>Log</h2>
    <div id="log"></div>
  </div>
</div>

<div id="tileMenu">
  <div class="card gameSurface" hidden>
    <h2>Turn</h2>
    <div id="turnBanner">—</div>
    <div style="margin-top: 10px;">
      <div id="hand"></div>
    </div>
    <div class="row" style="margin-top: 10px;">
      <button id="rotateBtnLeft" class="secondary">Rotate ↺</button>
      <button id="rotateBtnRight" class="secondary">Rotate ↻</button>
      <button id="placeBtn">Place tile</button>
      <button id="replaceBtn" hidden>Replace Tile</button>
      <button id="confirmReplaceBtn" class="secondary" hidden>Confirm</button>
    </div>
  </div>

  <br>

  <div class="card gameSurface" hidden>
    <h2>Selected variants</h2>
    <ul id="activeVariants"></ul>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js" defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
